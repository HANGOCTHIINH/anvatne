<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình Tạo Prompt Nghệ Thuật (Phiên bản Hoàn thiện)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-text: #ffffff;
            --secondary-text: #e0e0e0;
            --accent-color: #ff4081;
            --accent-hover: #ff80ab;
            --accent-2: #3f51b5;
            --card-bg: rgba(22, 22, 34, 0.65);
            --input-bg: rgba(0, 0, 0, 0.3);
            --input-border: rgba(255, 255, 255, 0.2);
            --input-focus-border: var(--accent-color);
            --border-radius: 12px;
            --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            color: var(--primary-text);
            line-height: 1.7;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
        }
        
        body::before {
            content: ''; position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #161622; z-index: -2;
        }

        .aurora {
            position: fixed; top: 50%; left: 50%;
            border-radius: 50%; filter: blur(120px);
            opacity: 0.4; z-index: -1;
            animation: move 20s linear infinite;
        }
        .aurora-1 { width: 500px; height: 500px; background: var(--accent-color); transform: translate(-50%, -50%); animation-delay: 0s; }
        .aurora-2 { width: 400px; height: 400px; background: var(--accent-2); animation-delay: -5s; }
        .aurora-3 { width: 450px; height: 450px; background: #00bcd4; animation-delay: -10s; }

        @keyframes move {
            0%, 100% { transform: translate(-60%, -60%) rotate(0deg) scale(1.2); }
            25% { transform: translate(60%, -40%) rotate(90deg) scale(0.8); }
            50% { transform: translate(40%, 60%) rotate(180deg) scale(1.1); }
            75% { transform: translate(-50%, 40%) rotate(270deg) scale(0.9); }
        }

        .container {
            max-width: 1400px; margin: 20px auto;
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 30px; background: var(--card-bg);
            padding: 30px; border-radius: var(--border-radius);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: var(--shadow); position: relative; z-index: 1;
        }

        header { grid-column: 1 / -1; text-align: center; margin-bottom: 10px; }
        header h1 { font-size: 2.5rem; font-weight: 700; color: var(--primary-text); text-shadow: 0 0 15px var(--accent-color); }

        .input-column, .output-column { padding: 15px; display: flex; flex-direction: column; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; color: var(--secondary-text); }
        
        .label-with-action { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .link-btn { background: none; border: none; color: var(--accent-color); cursor: pointer; font-size: 0.9rem; text-decoration: underline; padding: 0; transition: color 0.3s; }
        .link-btn:hover { color: var(--accent-hover); }

        .form-group input[type="text"], .form-group input[type="password"], .form-group select, .form-group textarea {
            width: 100%; padding: 14px;
            border: 1px solid var(--input-border); border-radius: var(--border-radius);
            background-color: var(--input-bg); color: var(--primary-text);
            font-size: 1rem; font-family: 'Be Vietnam Pro', sans-serif;
            transition: all 0.3s ease;
        }
        
        .form-group input:disabled { background-color: rgba(0,0,0,0.4); cursor: not-allowed; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none; border-color: var(--input-focus-border);
            box-shadow: 0 0 10px rgba(255, 64, 129, 0.5);
        }
        .form-group textarea { resize: vertical; min-height: 80px; }

        .btn {
            width: 100%; padding: 15px;
            color: var(--primary-text); border: none;
            border-radius: var(--border-radius); font-size: 1.2rem;
            font-weight: 700; cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-primary { background: linear-gradient(45deg, var(--accent-color), var(--accent-hover)); box-shadow: 0 4px 15px rgba(255, 64, 129, 0.4); }
        .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(255, 64, 129, 0.6); }
        .btn-primary:active { transform: translateY(0); }
        .btn-primary:disabled { background: #555; cursor: not-allowed; box-shadow: none; }

        .btn-secondary { background: linear-gradient(45deg, var(--accent-2), #6c7ff0); box-shadow: 0 4px 15px rgba(63, 81, 181, 0.4); }
        .btn-secondary:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(63, 81, 181, 0.6); }

        #idea-generator { border: 1px solid var(--input-border); padding: 20px; border-radius: var(--border-radius); margin-bottom: 30px; background: rgba(0,0,0,0.1); }
        #idea-generator h3 { text-align: center; margin-bottom: 15px; font-weight: 500; }
        #idea-suggestions { margin-top: 15px; display: flex; flex-direction: column; gap: 10px; }
        .suggestion-card { background: var(--input-bg); padding: 10px 15px; border-radius: var(--border-radius); border: 1px solid transparent; cursor: pointer; transition: all 0.3s ease; }
        .suggestion-card:hover { border-color: var(--accent-2); transform: translateX(5px); }
        .suggestion-card strong { color: var(--accent-hover); }

        .output-column h2 { color: var(--primary-text); margin-bottom: 15px; text-align: center; font-weight: 500; }
        #result-wrapper { position: relative; flex-grow: 1; display: flex; flex-direction: column; }
        #result { width: 100%; flex-grow: 1; background-color: var(--input-bg); border: 1px solid var(--input-border); border-radius: var(--border-radius); padding: 15px; color: var(--secondary-text); font-size: 1rem; white-space: pre-wrap; word-wrap: break-word; overflow-y: auto; min-height: 250px; transition: all 0.3s; }
        
        .result-actions { display: flex; gap: 10px; margin-top: 15px; }
        #copy-btn, #generate-variations-btn { flex: 1; padding: 10px; font-size: 0.9rem; }
        
        #variations-section, #history-section { margin-top: 20px; }
        #variations-section h3, #history-section h3 { text-align: center; margin-bottom: 10px; font-weight: 500; }
        #variations-result, #history-list { background: rgba(0,0,0,0.1); padding: 15px; border-radius: var(--border-radius); white-space: pre-wrap; word-wrap: break-word; font-size: 0.95rem; max-height: 300px; overflow-y: auto; }
        
        .history-item { background: var(--input-bg); padding: 10px 15px; margin-bottom: 10px; border-radius: var(--border-radius); cursor: pointer; transition: all 0.3s ease; }
        .history-item:hover { background-color: rgba(255, 64, 129, 0.2); }
        .history-item p { margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .loader { border: 5px solid rgba(255,255,255,0.2); border-top: 5px solid var(--accent-color); border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 50px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .message { padding: 10px; border-radius: var(--border-radius); margin-top: 15px; text-align: center; }
        .error { background-color: #ff4d4d; color: white; }
        .info { background-color: var(--accent-2); color: white; }
        
        .hidden { display: none; }

        @media (max-width: 1200px) { .container { grid-template-columns: 1fr; margin: 10px auto; } }
        @media (max-width: 576px) { body { padding: 10px; } .container { padding: 15px; } }
    </style>
</head>
<body>
    <div class="aurora aurora-1"></div>
    <div class="aurora aurora-2"></div>
    <div class="aurora aurora-3"></div>

    <div class="container">
        <header><h1>Trình Tạo Prompt Hoàn Thiện</h1></header>

        <div class="input-column">
            <div id="idea-generator">
                <h3>Bạn bí ý tưởng?</h3>
                <div class="form-group"><input type="text" id="idea-keyword" placeholder="Nhập một từ khóa (ví dụ: 'cô đơn')"></div>
                <button type="button" id="suggest-ideas-btn" class="btn btn-secondary">✨ Gợi ý cho tôi!</button>
                <div id="idea-loader" class="loader hidden"></div>
                <div id="idea-suggestions" class="hidden"></div>
            </div>

            <form id="prompt-form">
                <div class="form-group"><label for="character">Nhân vật</label><input type="text" id="character" name="character" placeholder="Ví dụ: một nữ thần cô độc"></div>
                <div class="form-group"><label for="action">Hành động/Tư thế</label><input type="text" id="action" name="action" placeholder="Ví dụ: đang ngắm nhìn vũ trụ tan vỡ"></div>
                <div class="form-group"><label for="setting">Bối cảnh/Nền</label><input type="text" id="setting" name="setting" placeholder="Ví dụ: trên ban công của một lâu đài thiên thể"></div>
                <div class="form-group"><label for="lighting">Ánh sáng</label><input type="text" id="lighting" name="lighting" placeholder="Ví dụ: ánh sáng bạc từ các tinh vân"></div>
                <div class="form-group"><label for="art-style">Phong cách nghệ thuật</label><select id="art-style" name="art-style"><option value="Photorealistic">Nhiếp ảnh chân thực</option><option value="Cinematic">Điện ảnh</option><option value="Anime, Ghibli Studio style">Anime (Ghibli)</option><option value="Concept Art, digital painting">Concept Art</option><option value="Oil Painting">Tranh sơn dầu</option><option value="Cyberpunk, futuristic">Cyberpunk</option><option value="Fantasy, epic">Fantasy</option></select></div>
                <div class="form-group"><label for="mood">Tông màu/Cảm xúc</label><select id="mood" name="mood"><option value="standard">Bình thường</option><option value="dramatic, epic, intense">Kịch tính & Bi tráng</option><option value="romantic, dreamy, soft">Lãng mạn & Mơ mộng</option><option value="mysterious, dark, eerie">Huyền bí & U ám</option><option value="sensual, intimate, artistic nude study">Gợi cảm & Tinh tế</option></select></div>
                <div class="form-group"><label for="aspect-ratio">Định dạng khung ảnh</label><select id="aspect-ratio" name="aspect-ratio"><option value="--ar 1:1">Vuông (1:1)</option><option value="--ar 16:9">Ngang (16:9)</option><option value="--ar 9:16">Dọc (9:16)</option></select></div>
                <div class="form-group"><label for="details">Chi tiết bổ sung (tiếng Việt)</label><textarea id="details" name="details" placeholder="Ví dụ: nước mắt pha lê lăn trên má"></textarea></div>
                <!-- ✨ TÍNH NĂNG MỚI: PROMPT PHỦ ĐỊNH ✨ -->
                <div class="form-group"><label for="negative-prompt">Prompt Phủ định (Những gì KHÔNG muốn thấy)</label><textarea id="negative-prompt" name="negative-prompt" placeholder="Ví dụ: xấu xí, biến dạng, thừa ngón tay, chữ ký, logo"></textarea></div>
                <div class="form-group"><div class="label-with-action"><label for="api-key">API Key của Gemini</label><button type="button" id="change-api-key-btn" class="link-btn hidden">Thay đổi</button></div><input type="password" id="api-key" name="api-key" placeholder="Nhập và lưu API Key của bạn"></div>
                <button type="submit" class="btn btn-primary">Tạo Prompt</button>
                <div id="form-message" class="message hidden"></div>
            </form>
        </div>

        <div class="output-column">
            <h2>Prompt nghệ thuật của bạn</h2>
            <div id="main-loader" class="loader hidden"></div>
            <div id="result-wrapper">
                <div id="result">Prompt sẽ xuất hiện ở đây...</div>
                <div class="result-actions hidden">
                    <button id="copy-btn" class="btn btn-secondary">Sao chép</button>
                    <button id="generate-variations-btn" class="btn btn-primary">✨ Tạo 3 biến thể</button>
                </div>
            </div>
             <div id="variations-section" class="hidden">
                <h3>Các biến thể nghệ thuật:</h3>
                <div id="variations-loader" class="loader hidden"></div>
                <div id="variations-result"></div>
            </div>
            <!-- ✨ TÍNH NĂNG MỚI: LỊCH SỬ SÁNG TẠO ✨ -->
            <div id="history-section" class="hidden">
                <div class="label-with-action">
                    <h3>Lịch sử Sáng tạo</h3>
                    <button id="clear-history-btn" class="link-btn">Xóa lịch sử</button>
                </div>
                <div id="history-list"></div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const promptForm = document.getElementById('prompt-form');
            const mainLoader = document.getElementById('main-loader');
            const resultDiv = document.getElementById('result');
            const resultWrapper = document.getElementById('result-wrapper');
            const resultActions = document.querySelector('.result-actions');
            const copyBtn = document.getElementById('copy-btn');
            const apiKeyInput = document.getElementById('api-key');
            const formMessage = document.getElementById('form-message');
            const changeApiKeyBtn = document.getElementById('change-api-key-btn');
            
            const suggestIdeasBtn = document.getElementById('suggest-ideas-btn');
            const ideaKeywordInput = document.getElementById('idea-keyword');
            const ideaLoader = document.getElementById('idea-loader');
            const ideaSuggestionsDiv = document.getElementById('idea-suggestions');

            const generateVariationsBtn = document.getElementById('generate-variations-btn');
            const variationsSection = document.getElementById('variations-section');
            const variationsLoader = document.getElementById('variations-loader');
            const variationsResultDiv = document.getElementById('variations-result');

            const historySection = document.getElementById('history-section');
            const historyList = document.getElementById('history-list');
            const clearHistoryBtn = document.getElementById('clear-history-btn');

            loadApiKey();
            loadAndRenderHistory();

            promptForm.addEventListener('submit', handleFormSubmit);
            copyBtn.addEventListener('click', copyToClipboard);
            changeApiKeyBtn.addEventListener('click', enableApiKeyChange);
            suggestIdeasBtn.addEventListener('click', handleSuggestIdeas);
            generateVariationsBtn.addEventListener('click', handleGenerateVariations);
            clearHistoryBtn.addEventListener('click', clearHistory);

            function loadApiKey() {
                const savedKey = localStorage.getItem('geminiApiKey');
                if (savedKey) {
                    apiKeyInput.value = savedKey;
                    apiKeyInput.disabled = true;
                    changeApiKeyBtn.classList.remove('hidden');
                }
            }

            function enableApiKeyChange() {
                localStorage.removeItem('geminiApiKey');
                apiKeyInput.value = '';
                apiKeyInput.disabled = false;
                apiKeyInput.placeholder = 'Nhập API Key mới và nhấn nút để lưu';
                apiKeyInput.focus();
                changeApiKeyBtn.classList.add('hidden');
                displayMessage('Bạn có thể nhập API Key mới.', 'info');
            }
            
            function getApiKey() {
                const apiKey = apiKeyInput.value.trim();
                 if (!apiKey) {
                    displayMessage('Vui lòng cung cấp API Key của Gemini.', 'error');
                    return null;
                }
                if (!localStorage.getItem('geminiApiKey')) {
                    localStorage.setItem('geminiApiKey', apiKey);
                    apiKeyInput.disabled = true;
                    changeApiKeyBtn.classList.remove('hidden');
                }
                return apiKey;
            }

            async function handleSuggestIdeas() {
                const keyword = ideaKeywordInput.value.trim();
                if (!keyword) {
                    displayMessage('Vui lòng nhập một từ khóa để gợi ý.', 'error');
                    return;
                }
                const apiKey = getApiKey();
                if (!apiKey) return;

                ideaLoader.classList.remove('hidden');
                ideaSuggestionsDiv.classList.add('hidden');
                suggestIdeasBtn.disabled = true;

                const prompt = `Dựa trên từ khóa tiếng Việt "${keyword}", hãy tạo ra 3 ý tưởng kịch bản độc đáo để vẽ tranh AI. Mỗi ý tưởng phải bao gồm: "nhanVat", "hanhDong", "boiCanh", và "anhSang" bằng tiếng Việt. Trả về kết quả dưới dạng một JSON array.`;
                const schema = {
                    type: "ARRAY",
                    items: {
                        type: "OBJECT",
                        properties: {
                            "nhanVat": { "type": "STRING" },
                            "hanhDong": { "type": "STRING" },
                            "boiCanh": { "type": "STRING" },
                            "anhSang": { "type": "STRING" }
                        },
                        required: ["nhanVat", "hanhDong", "boiCanh", "anhSang"]
                    }
                };

                try {
                    const result = await callGeminiApi(prompt, apiKey, schema);
                    const suggestions = JSON.parse(result);
                    displaySuggestions(suggestions);
                } catch (error) {
                    displayMessage(`Lỗi khi gợi ý: ${error.message}`, 'error');
                } finally {
                    ideaLoader.classList.add('hidden');
                    suggestIdeasBtn.disabled = false;
                }
            }
            
            function displaySuggestions(suggestions) {
                ideaSuggestionsDiv.innerHTML = '';
                suggestions.forEach((idea, index) => {
                    const card = document.createElement('div');
                    card.className = 'suggestion-card';
                    card.innerHTML = `<strong>Ý tưởng ${index + 1}:</strong> ${idea.nhanVat} ${idea.hanhDong}.`;
                    card.onclick = () => {
                        document.getElementById('character').value = idea.nhanVat;
                        document.getElementById('action').value = idea.hanhDong;
                        document.getElementById('setting').value = idea.boiCanh;
                        document.getElementById('lighting').value = idea.anhSang;
                        ideaSuggestionsDiv.classList.add('hidden');
                    };
                    ideaSuggestionsDiv.appendChild(card);
                });
                ideaSuggestionsDiv.classList.remove('hidden');
            }

            async function handleGenerateVariations() {
                const originalPrompt = resultDiv.innerText;
                if (!originalPrompt || originalPrompt.startsWith('Prompt')) return;
                
                const apiKey = getApiKey();
                if (!apiKey) return;

                variationsSection.classList.remove('hidden');
                variationsLoader.classList.remove('hidden');
                variationsResultDiv.innerHTML = '';
                generateVariationsBtn.disabled = true;

                const prompt = `Hãy đóng vai một đạo diễn nghệ thuật. Dựa trên prompt gốc sau đây, hãy tạo ra 3 biến thể độc đáo bằng tiếng Việt. Mỗi biến thể nên thay đổi một khía cạnh quan trọng như góc máy, cảm xúc, thời điểm trong ngày, hoặc chi tiết ẩn dụ, nhưng vẫn giữ lại phần từ khóa kỹ thuật và prompt phủ định. Trả về kết quả dưới dạng danh sách có đánh số.
                
                Prompt gốc: "${originalPrompt}"`;

                try {
                    const variations = await callGeminiApi(prompt, apiKey);
                    variationsResultDiv.innerText = variations;
                } catch (error) {
                    variationsResultDiv.innerText = `Lỗi khi tạo biến thể: ${error.message}`;
                } finally {
                    variationsLoader.classList.add('hidden');
                    generateVariationsBtn.disabled = false;
                }
            }

            async function handleFormSubmit(e) {
                e.preventDefault();
                const apiKey = getApiKey();
                if (!apiKey) return;

                const formData = {
                    character: document.getElementById('character').value.trim(),
                    action: document.getElementById('action').value.trim(),
                    setting: document.getElementById('setting').value.trim(),
                    lighting: document.getElementById('lighting').value.trim(),
                    artStyle: document.getElementById('art-style').value,
                    mood: document.getElementById('mood').value,
                    aspectRatio: document.getElementById('aspect-ratio').value,
                    details: document.getElementById('details').value.trim(),
                    negativePrompt: document.getElementById('negative-prompt').value.trim()
                };

                const userPrompt = `Hãy đóng vai một nhà văn, một nghệ sĩ bậc thầy về ngôn từ, chuyên sáng tạo prompt cho các AI tạo ảnh. Nhiệm vụ của bạn là dệt nên một bức tranh toàn cảnh bằng ngôn từ từ những ý tưởng bên dưới.
                
                **Quy tắc vàng:**
                1.  **Miêu tả sâu bằng tiếng Việt:** Tạo ra một đoạn văn tiếng Việt giàu cảm xúc, chi tiết, đầy chất thơ. Miêu tả sâu sắc về nhân vật, trang phục, cảm xúc, tư thế, bối cảnh, và không khí chung.
                2.  **Xử lý chủ đề nhạy cảm (18+):** Khi có yêu cầu, hãy dùng ngôn ngữ nghệ thuật và ẩn dụ để miêu tả vẻ đẹp hình thể. Tập trung vào đường cong, ánh sáng và bóng tối trên da thịt, sự thân mật tinh tế. **TUYỆT ĐỐI TRÁNH** các từ ngữ thô tục, trực diện. Mục tiêu là tạo ra một tác phẩm nghệ thuật.
                
                **Nguyên liệu sáng tạo:**
                - Nhân vật: ${formData.character || 'không có'}
                - Hành động/Tư thế: ${formData.action || 'không có'}
                - Bối cảnh/Nền: ${formData.setting || 'không có'}
                - Ánh sáng: ${formData.lighting || 'không có'}
                - Chi tiết khác: ${formData.details || 'không có'}
                - Các yếu tố cần loại bỏ: ${formData.negativePrompt || 'không có'}

                **Định dạng đầu ra (BẮT BUỘC):**
                - **Phần 1:** Đoạn văn miêu tả chi tiết bằng tiếng Việt.
                - **Phần 2:** Sau một dòng phân cách "---", liệt kê các từ khóa kỹ thuật bằng tiếng Anh, bao gồm: từ khóa từ "Phong cách nghệ thuật" (${formData.artStyle}), từ khóa từ "Tông màu/Cảm xúc" (${formData.mood}), và các từ khóa chất lượng cao mặc định (cinematic, ultra realistic, 8k, sharp focus, intricate details, professional photography).
                - **Phần 3:** Nếu có "Prompt Phủ định", thêm một dòng phân cách "---" nữa và bắt đầu bằng "--no" theo sau là các từ khóa phủ định bằng tiếng Anh đã được dịch và mở rộng từ ý của người dùng.
                
                **Ví dụ đầu ra:**
                (Một đoạn văn tiếng Việt miêu tả chi tiết ở đây)
                ---
                cinematic, Photorealistic, dramatic, epic, intense, ultra realistic, 8k, sharp focus, intricate details, professional photography, ${formData.aspectRatio}
                ---
                --no deformed, ugly, signature, text, watermark

                **Hãy bắt đầu!**`;
                
                showMainLoading(true);
                displayMessage('', 'clear');
                variationsSection.classList.add('hidden');

                try {
                    const generatedPrompt = await callGeminiApi(userPrompt, apiKey);
                    displayResult(generatedPrompt);
                    savePromptToHistory(formData, generatedPrompt);
                } catch (error) {
                    displayMessage(`Đã xảy ra lỗi: ${error.message}. Hãy kiểm tra lại API Key.`, 'error');
                    displayResult('Không thể tạo prompt do có lỗi xảy ra.');
                } finally {
                    showMainLoading(false);
                }
            }

            async function callGeminiApi(prompt, apiKey, schema = null) {
                const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=${apiKey}`;
                
                const requestBody = {
                    contents: [{ parts: [{ text: prompt }] }],
                    safetySettings: [
                        { category: "HARM_CATEGORY_HARASSMENT", threshold: "BLOCK_ONLY_HIGH" },
                        { category: "HARM_CATEGORY_HATE_SPEECH", threshold: "BLOCK_ONLY_HIGH" },
                        { category: "HARM_CATEGORY_SEXUALLY_EXPLICIT", threshold: "BLOCK_ONLY_HIGH" },
                        { category: "HARM_CATEGORY_DANGEROUS_CONTENT", threshold: "BLOCK_ONLY_HIGH" },
                    ]
                };
                
                if (schema) {
                    requestBody.generationConfig = {
                        responseMimeType: "application/json",
                        responseSchema: schema
                    };
                }

                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error?.message || `Lỗi HTTP: ${response.status}`);
                }

                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content) {
                     return data.candidates[0].content.parts[0].text;
                } else {
                    if (data.candidates && data.candidates[0].finishReason === 'SAFETY') {
                         throw new Error('Prompt đã bị chặn vì lý do an toàn. Hãy thử dùng từ ngữ tinh tế hơn.');
                    }
                    throw new Error('Không nhận được nội dung hợp lệ từ API.');
                }
            }
            
            // --- History Management ---
            function getHistory() {
                return JSON.parse(localStorage.getItem('promptHistory')) || [];
            }

            function savePromptToHistory(formData, generatedPrompt) {
                let history = getHistory();
                const historyEntry = {
                    formData: formData,
                    generatedPrompt: generatedPrompt,
                    timestamp: new Date().getTime()
                };
                history.unshift(historyEntry); // Add to the beginning
                if (history.length > 20) { // Limit history size
                    history.pop();
                }
                localStorage.setItem('promptHistory', JSON.stringify(history));
                loadAndRenderHistory();
            }

            function loadAndRenderHistory() {
                let history = getHistory();
                historyList.innerHTML = '';
                if (history.length > 0) {
                    historySection.classList.remove('hidden');
                    history.forEach(entry => {
                        const item = document.createElement('div');
                        item.className = 'history-item';
                        item.innerHTML = `<p>${entry.formData.character || 'Prompt không tên'}</p><small>${new Date(entry.timestamp).toLocaleString()}</small>`;
                        item.onclick = () => loadPromptFromHistory(entry);
                        historyList.appendChild(item);
                    });
                } else {
                    historySection.classList.add('hidden');
                }
            }

            function loadPromptFromHistory(entry) {
                for (const key in entry.formData) {
                    const element = document.getElementById(key.replace(/([A-Z])/g, "-$1").toLowerCase());
                    if (element) {
                        element.value = entry.formData[key];
                    }
                }
                displayResult(entry.generatedPrompt);
                window.scrollTo(0, 0);
            }

            function clearHistory() {
                if (confirm('Bạn có chắc muốn xóa toàn bộ lịch sử sáng tạo?')) {
                    localStorage.removeItem('promptHistory');
                    loadAndRenderHistory();
                }
            }

            function copyToClipboard() {
                const textToCopy = resultDiv.innerText;
                if (!textToCopy || textToCopy.startsWith('Prompt')) return;
                navigator.clipboard.writeText(textToCopy).then(() => {
                    const originalText = copyBtn.innerText;
                    copyBtn.innerText = 'Đã sao chép!';
                    setTimeout(() => { copyBtn.innerText = originalText; }, 2000);
                });
            }

            function showMainLoading(isLoading) {
                mainLoader.classList.toggle('hidden', !isLoading);
                resultWrapper.classList.toggle('hidden', isLoading);
            }

            function displayResult(text) {
                resultDiv.innerText = text;
                resultActions.classList.remove('hidden');
            }

            function displayMessage(message, type) {
                formMessage.className = `message ${type}`;
                formMessage.innerText = message;
            }
        });
    </script>
</body>
</html>
